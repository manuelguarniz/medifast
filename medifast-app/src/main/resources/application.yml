spring:
  application:
    name: medifast
  datasource:
    # Usuario con privilegios mínimos creado en docs/sql/01_schema.sql
    url: ${MEDIFAST_DB_URL:jdbc:mysql://localhost:3306/medifast?serverTimezone=America/Lima}
    username: ${MEDIFAST_DB_USER:medifast_app}
    password: ${MEDIFAST_DB_PASSWORD:medifast_app}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo definen los scripts de docs/sql; Hibernate no lo modifica
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
  servlet:
    multipart:
      # RN-11 limita la constancia a 5 MB; PagoService lo valida con su mensaje. Este tope, más alto, solo corta
      # envíos muy grandes antes de leerlos.
      max-file-size: 10MB
      max-request-size: 11MB

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
  error:
    whitelabel:
      enabled: false

medifast:
  # Constancias fuera de static/ (RNF06)
  uploads-dir: ${MEDIFAST_UPLOADS_DIR:uploads/comprobantes}
  # Número de Yape de ejemplo que muestra P3: el pago es simulado (RF03)
  yape-numero: ${MEDIFAST_YAPE_NUMERO:999 888 777}
