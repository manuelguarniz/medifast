<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Acceso denegado')}"></head>

<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbarErrores}"></nav>

    <main class="container py-5">
        <div class="medifast-error-card text-center">
            <span class="medifast-error-codigo">403</span>

            <h1>Acceso denegado</h1>

            <p>
                No tienes permisos para acceder
                a esta página o realizar esta operación.
            </p>

            <a th:href="@{/}" class="btn medifast-error-boton">
                Volver al inicio
            </a>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
