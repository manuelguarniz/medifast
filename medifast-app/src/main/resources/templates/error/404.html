<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Página no encontrada')}"></head>

<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbarErrores}"></nav>

    <main class="container py-5">
        <div class="medifast-error-card text-center">
            <span class="medifast-error-codigo">404</span>

            <h1>Página no encontrada</h1>

            <p>
                La página o el recurso que buscas
                no existe o ya no está disponible.
            </p>

            <a th:href="@{/}" class="btn medifast-error-boton">
                Volver al inicio
            </a>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
