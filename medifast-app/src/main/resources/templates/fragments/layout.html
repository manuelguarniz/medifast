<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · MEDIFAST'">MEDIFAST</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/medifast.css}">
</head>
<body>

<!-- Barra de navegación por rol (común a P0–P10) -->
<nav th:fragment="navbar" class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">MEDIFAST</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu" sec:authorize="isAuthenticated()">
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('PACIENTE')">
                <li class="nav-item"><a class="nav-link" th:href="@{/paciente/disponibilidad}">Reservar</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/paciente/citas}">Mis citas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/paciente/perfil}">Mi perfil</a></li>
            </ul>
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('MEDICO')">
                <li class="nav-item"><a class="nav-link" th:href="@{/medico/agenda}">Agenda</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/medico/reportes/citas}">Reporte de citas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/medico/reportes/pagos}">Reporte de pagos</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<!-- Navbar superior del paciente (diseño aprobado de P6); activo: reservar | citas | perfil -->
<nav th:fragment="navbarPaciente(activo)" class="paciente-nav" aria-label="Navegación del paciente">
    <div class="paciente-nav-inner">
        <a class="reserva-brand" th:href="@{/paciente/reservar}" aria-label="MEDIFAST, Consultorio Medifast">
            <span class="reserva-brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M3 12h4l2.2-6 4.1 12 2.1-6H21"/>
                </svg>
            </span>
            <span class="reserva-brand-copy"><strong>MEDIFAST</strong><small>Consultorio Medifast</small></span>
        </a>
        <button class="paciente-nav-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#pacienteMenu"
                aria-controls="pacienteMenu" aria-expanded="false" aria-label="Menú">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
            <span>Menú</span>
        </button>
        <div class="paciente-nav-menu collapse" id="pacienteMenu">
            <a th:href="@{/paciente/reservar}" th:classappend="${activo == 'reservar'} ? 'active'"
               th:attr="aria-current=${activo == 'reservar' ? 'page' : null}">Reservar cita</a>
            <a th:href="@{/paciente/citas}" th:classappend="${activo == 'citas'} ? 'active'"
               th:attr="aria-current=${activo == 'citas' ? 'page' : null}">Mis citas</a>
            <a th:href="@{/paciente/perfil}" th:classappend="${activo == 'perfil'} ? 'active'"
               th:attr="aria-current=${activo == 'perfil' ? 'page' : null}">Mi perfil</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit">Salir</button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
