<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <h1 class="h4">Bienvenido</h1>
    <p class="text-muted">Sesión iniciada con el documento <span sec:authentication="name"></span>.</p>

    <div sec:authorize="hasRole('PACIENTE')">
        <a class="btn btn-primary" th:href="@{/paciente/disponibilidad}">Reservar una cita</a>
    </div>
    <div sec:authorize="hasRole('MEDICO')">
        <a class="btn btn-primary" th:href="@{/medico/agenda}">Ver mi agenda</a>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
